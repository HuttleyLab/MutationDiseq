name: Lint code using ruff

on:
  push:
    branches-ignore:
      - master

jobs:
  linters:
    runs-on: ubuntu-latest
    if: github.repository == 'HuttleyLab/MutationDiseq'

    env:
      # fail rather than silently re-resolving when uv.lock is out of date
      UV_LOCKED: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Format code using ruff
        run: |
          uv run --only-group lint ruff check --fix-only .
          uv run --only-group lint ruff format .

      - name: Commit changes
        uses: EndBug/add-and-commit@v11
        with:
          author_name: ${{ github.actor }}
          author_email: ${{ github.actor }}@users.noreply.github.com
          message: "STY: pre-commit linting with ruff"
          add: "."
