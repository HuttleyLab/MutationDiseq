name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}

    env:
      # fail rather than silently re-resolving when uv.lock is out of date
      UV_LOCKED: "1"

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "${{ matrix.python-version }}"

      - name: Install nox
        run: uv tool install nox

      - name: "Run nox for ${{ matrix.python-version }}"
        run: "nox -db uv -p ${{ matrix.python-version }} -s test -- --cov-report lcov:lcov-${{matrix.os}}-${{matrix.python-version}}.lcov --cov-report term --cov-append --cov mdeq"

      - name: Coveralls Parallel
        uses: coverallsapp/github-action@v2
        env:
          # macOS installs the coverage-reporter via a third-party Homebrew
          # tap; Homebrew's new tap-trust enforcement refuses it otherwise.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        with:
          parallel: true
          github-token: ${{ secrets.github_token }}
          flag-name: run-${{matrix.python-version}}-${{matrix.os}}
          file: "tests/lcov-${{matrix.os}}-${{matrix.python-version}}.lcov"

  finish:
    name: "Finish Coveralls"
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
