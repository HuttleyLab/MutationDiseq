[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "mdeq"
version = "2026.49.24"
description = "mdeq: mutation disequilibrium analysis tools."
authors = [
    { name = "Katherine Caley", email = "katherine.caley@anu.edu.au" },
    { name = "Gavin Huttley", email = "Gavin.Huttley@anu.edu.au" },
]
keywords = [
    "biology",
    "genomics",
    "statistics",
    "phylogeny",
    "evolution",
    "bioinformatics",
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "cogent3>=2026.9.10",
    "scinexus",
    "click",
    "numpy",
    "scipy",
    "scitrack",
    "rich",
    "trogon",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
mdeq = "mdeq:main"

[dependency-groups]
test = ["pytest", "pytest-cov", "pytest-xdist", "nox"]
lint = ["ruff==0.16.7"]
dev = [
    "cogapp",
    "docformatter",
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv.build-backend]
module-name = "mdeq"
module-root = "src"
# the backend does not read .gitignore, so tool caches under src/ would ship
source-exclude = ["**/.mypy_cache", "**/.pytest_cache", "**/.ruff_cache"]
wheel-exclude = ["**/.mypy_cache", "**/.pytest_cache", "**/.ruff_cache"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "-ra"]
testpaths = "tests"
